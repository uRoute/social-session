<section>
    @for(post of posts() ;track post._id){
    <div class="posts bg-white p-2 rounded-xl my-2">
        <div class="post-head flex p-1 items-center justify-between">
            <div class="user-info p-0.5 flex gap-2 justify-between items-center">
                <div class="user-img w-10 h-10 rounded-full border-2 border-neutral-400 p-1">
                    <img class="w-full size-full rounded-full" [src]="post.user.photo"
                        [alt]="`${post.user.name}'s photo`">
                </div>
                <div class="user-name">
                    <h1 class="text-md font-medium"> {{post.user.name}} </h1>
                    <div class="text-gray-500 text-xs">
                        <span class="mx-0.5">{{post.user.username}} .</span>
                        <span class="mx-0.5">{{post.createdAt}} .</span>
                        <span class="mx-0.5"> {{post.privacy}} </span>
                    </div>
                </div>
            </div>
            <div class="user-toggle-action ">
                <button><i class="fa-solid fa-sliders cursor-pointer"></i></button>
            </div>
        </div>
        <div class="post p-1">
            @if(post.body){
            <div class="post-body my-1">
                <h4 class="text-neutral-800"> {{post.body}} </h4>
            </div>
            }
            @if(post.image){
            <div class="post-img w-full  my-1 rounded-lg">
                <img class="w-full h-full rounded-lg object-cover" [src]="post.image" alt="">
            </div>
            }
        </div>
        <div class="post-reactions flex justify-between items-center w-3/4 mx-auto p-1">
            <button class="block w-1/3 rounded-xl p-1 hover:bg-slate-200 duration-150"> <i
                    class="fa-regular fa-heart"></i> Like</button>
            <button class="block w-1/3 rounded-xl p-1 hover:bg-slate-200 duration-150"> <i
                    class="fa-regular fa-comment"></i> Comment</button>
            <button class="block w-1/3 rounded-xl p-1 hover:bg-slate-200 duration-150"> <i
                    class="fa-solid fa-share"></i> Share</button>
        </div>
    </div>
    }
</section>
